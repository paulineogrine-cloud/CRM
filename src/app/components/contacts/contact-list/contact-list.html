<div class="container">
  <div class="mb-4">
    <h2 class="mb-3">📇 Mes Contacts</h2>
    <input 
      type="text" 
      class="form-control"
      placeholder="🔍 Rechercher par prénom ou nom..."
      [(ngModel)]="searchQuery"
      (input)="onSearchChange()"
    />
  </div>
  
  <div class="mb-3">
    <span class="badge bg-primary">👥 {{count}} contact<span *ngIf="count !== 1">s</span></span>
  </div>
  
  <div class="row" *ngIf="filteredContacts.length > 0">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let c of filteredContacts">
      <div class="card h-100" [ngClass]="{'border-warning': c.favorite}">
        <div class="card-body">
          <h5 class="card-title">{{ c.firstname }} {{ c.lastname }}</h5>
          <p class="card-text"><strong>📧 Email :</strong> <br /> {{ c.email }}</p>
          <p class="card-text"><strong>💼 Entreprise :</strong> <br /> {{ c.company }}</p>
          <p class="card-text"><strong>🎯 Titre :</strong> <br /> {{ c.jobTitle }}</p>
        </div>
        <div class="card-footer">
          <button class="btn btn-outline-warning" (click)="toggleFav(c.id)">
            {{ c.favorite ? '🤍 Retirer' : '💖 Favori' }}
          </button>
          <button class="btn btn-outline-danger" (click)="delete(c.id)">
            🗑️ Supprimer
          </button>
          <a [routerLink]="['/contacts', c.id]" class="btn btn-outline-primary">
            👁️ Voir
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <div *ngIf="filteredContacts.length === 0" class="no-results">
    <p>😔 Aucun contact ne correspond à votre recherche "<strong>{{searchQuery}}</strong>"</p>
  </div>
</div>
