<div *ngIf="contact as c" class="container mt-4">
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">{{ c.firstname }} {{ c.lastname }}</h2>
      <div *ngIf="c.notes; else noNotes">
        <h5 class="card-subtitle mb-2 text-muted">Notes</h5>
        <p class="card-text">{{ c.notes }}</p>
      </div>
      <ng-template #noNotes>
        <div class="alert alert-info">Aucun détail supplémentaire</div>
      </ng-template>
    </div>
  </div>
</div>
