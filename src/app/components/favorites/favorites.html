<div class="container">
  <div class="header mb-5">
    <h2>⭐ Mes Contacts Favoris</h2>
    <p class="subtitle">Vous avez <strong>{{ contacts.length }}</strong> contact<span *ngIf="contacts.length !== 1">s</span> favori<span *ngIf="contacts.length !== 1">s</span></p>
  </div>
  
  <div *ngIf="contacts.length > 0" class="favorites-grid">
    <div *ngFor="let c of contacts" class="card favorite-card">
      <div class="card-body">
        <div class="favorite-icon">💖</div>
        <h5 class="card-title">{{ c.firstname }} {{ c.lastname }}</h5>
        <div class="favorite-info">
          <p><strong>📧 Email :</strong><br /> {{ c.email }}</p>
          <p><strong>📱 Téléphone :</strong><br /> {{ c.phone }}</p>
        </div>
        <a [routerLink]="['/contacts', c.id]" class="btn btn-outline-primary btn-sm w-100 mt-3">
          Voir les détails
        </a>
      </div>
    </div>
  </div>
  
  <div *ngIf="contacts.length === 0" class="empty-state">
    <div class="empty-icon">📭</div>
    <p class="empty-text">Vous n'avez pas encore de contact favori</p>
    <a routerLink="/contacts" class="btn btn-primary">
      Ajouter un contact favori
    </a>
  </div>
</div>
